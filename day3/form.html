<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="backendApiAdress" method="POST">  
        <input type="email" placeholder="Enter your email" required><br>
        <input type="password" placeholder="Enter your password" required><br>
        <input type="text" minlength="3" maxlength="10" placeholder="Enter your name" required><br>
        <input type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required><br>
        <input type="number" min="18" max="100" step="1" required><br>
        <button type="submit">submit</button>
    </form>
</body>
</html>
