<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Username:</label>
    <input placeholder="Enter your name">
    <br>
    <input type="text" placeholder="Enter your name"><br>
    <input type="email" placeholder="Enter your email"><br>
    <input type="password" placeholder="****"><br>
    <input type="search" placeholder="Search..."><br>
    <input type="url" placeholder="Enter your website"><br>
    <input type="tel" placeholder="Enter your phone number"><br>
    <input type="number" placeholder="Enter your age"><br>
    <input type="number" min="18" max="100" step="1"><br>
    <input type="range" min="0" max="100" step="1"><br>
    <input type="date">
    <input type="time">
    <input type="month">
    <input type="week"><br>
    <!--Selection Input.--> 
     <input type="checkbox">
     <label> I agree to the terms and conditions</label>
    <input type="file">
    <input type="color"><br>
    <!--Validation-->
    <input type="text" required><br>
    <input type="text" minlength="3" maxlength="10"><br>
    <input type="tel" pattern="[0-9]{10}" placeholder="10-digit number"><br>
    <textarea placeholder="Enter your message"></textarea><br>
    <textarea rows="4" cols="50" placeholder="Enter your message"></textarea><br>
</body>
</html>
