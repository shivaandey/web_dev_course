<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .ecom{
            height:100vh;
            background-color: rgb(233, 241, 241);
            display: flex;
            justify-content: center;
            gap:50px;
            align-items: center;
            flex-wrap: wrap;
        }
        .product{
            width: 220px;
            height:350px;
            background-color: rgb(246, 135, 135);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid rgba(255, 0, 0, 0.685);
            border-radius: 20px;
            padding: 10px;
            
            margin:15px;
            box-shadow: 0 4px 6px black;
        }
        div img{
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        div h2{
            font-family: Arial, sans-serif;
            text-decoration: underline;
            color: brown;
            margin-bottom: 15px;

        }
        div p{
            font-family: Arial, sans-serif;
            text-decoration: underline;
            color: white;
            margin-bottom: 10px;

        }
        div button{
            background-color: orange;
            border: none;
            padding: 10px;
            border-radius: 20px;
        }
        .discount{
            font-size: 20px;
            color: aqua;
        }
    </style>
</head>
<body>
    <div class="ecom">
    <div class="product">
        <img src="https://images.pexels.com/photos/33797585/pexels-photo-33797585.jpeg" alt="Mobile" >
        <h2>Mobile</h2>
        <p>Rs 25,000</span></p>
        <button>Buy Now<span id="logo">📍</span></button>
    </div>
    <div class="product">
        <img src="https://images.pexels.com/photos/12210270/pexels-photo-12210270.jpeg" alt="Shoe"  >
        <h2>Shoe</h2>
        <p>Rs 5000</p>
        <button>Buy Now</button>
    </div>
    <div class="product">
        <img src="https://images.pexels.com/photos/7772548/pexels-photo-7772548.jpeg" alt="HeadPhone"  >
        <h2>Headphone</h2>
        <p>Rs 2000</p>
        <button>Buy Now</button>
    </div>
    
    </div>
</body>
</html>
