<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!--Div container- it is a box which we can add the content using any HTMl tag
it allows take 100%width - full width by default
Block level element(tag)-->
<body>
    <div style="background-color:bisque";width=220px>
        <h2>review</h2>
        <h3>ojas</h3>
        <p>Everything is good😊😊😊</p>
    </div>
    <div style="background-color:chocolate";width=220px>
        <h2>support</h2>
        <p>support@gmail.com</p>
        <p>+91 9059053451</p>
        <p>Location XYZ</p>
    </div>
    <!-- Span tag
     it only takes required Amount width as per content
     Inline Elememt(Tag)
     It can fot inside any HTML tag
     -->
     <p><span style="background-color:chartreuse;">Good Evening🌄</span>Shiva</p>
     <button>cart 0</button>
     <button>cart <span>0</span></button>
</body>
</html>
